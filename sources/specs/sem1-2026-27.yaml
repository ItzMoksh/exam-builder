      Sand is a granular material composed of very small, irregularly-shaped mineral particles. A student determines the density of sand by two methods, using a measuring cylinder on a top-pan balance (Fig. 1.1: 76 g empty; Fig. 1.2: 219 g with sand).
      Method 1. (a)(i) Use the values shown in Fig. 1.1 and Fig. 1.2 to calculate the mass m of the sand. [1] (ii) The student measures the volume V1 of the sand in the measuring cylinder, V1 = 108 cm3. Calculate a value for the density rho1 = m/V1 of the sand sample. Include a unit. [2]
      Method 2. (b)(i) The student pours 100 cm3 of water into the measuring cylinder containing the sand. Some of the water soaks into the sand and she waits for the water level to become constant. Record the reading V2 of the water level in the measuring cylinder shown in Fig. 1.3 (scale 150-160). [1] (ii) Calculate another value for the density rho2 = m/(V2 - k), where k = 100 cm3. [1] (iii) On Fig. 1.4, draw an arrow showing the correct line of sight for reading the volume of water in the measuring cylinder. [1]
      (c) Another student wants to determine the density of the particles in a similar sample of sand. (i) Explain why method 1 would not be a suitable method for him to use. [1] (ii) Explain why method 2 would give a more accurate value for the density of the particles in this sample of sand. [1]
      (d) Describe two possible sources of inaccuracy in the measurements taken in method 1 or method 2, even if they are carried out carefully. [2]
