      (ii) Calculate mW, the mass of water with volume V1, using the equation mW = rhoW x V1, where rhoW = 1.00 in the same units as rho in part (a)(iv). [1]
      (c) A student suggests that the mass m of the block of wood should be equal to the mass mW of the water with volume V1.
      (i) Calculate the difference d between your values of m and mW. [1]
      (ii) Discuss whether the difference d is small enough to conclude that m = mW. [1]
