questions:
  - n: "01"
    qno: 1
    type: theory
    marks: 9
    parts:
      - {label: "a(i)", marks: 2}
      - {label: "a(ii)", marks: 1}
      - {label: "b", marks: 2}
      - {label: "c", marks: 2}
      - {label: "d", marks: 2}
    syllabus: ["1.6", "1.2", "1.5.1"]
    tier: supplement
    difficulty: 2
    segments:
      - {page: 5, y0: 300, y1: 723, x0: 75, x1: 490}
      - {page: 6, y0: 60, y1: 645, x0: 60}
    ms:
      segments: [{page: 16, y0: 55, y1: 200}]
      text: "(a)(i) p = mv = 70 x 20 = 1400 kg m/s (ii) 1400 N s (b) a = 20/0.20 = 100 m/s^2 (c) F = ma = 70 x 80 = 5600 N (d) smaller force on passenger, less likely to be injured."
    text: |
      Fig. 2.1 shows a dummy of mass 70 kg used in a crash test to investigate the safety of a new car (barrier,
      passenger compartment, windscreen). The car approaches a solid barrier at 20 m/s, crashes and stops suddenly.
      (a)(i) Calculate the momentum of the dummy immediately before the crash. (ii) Determine the impulse that must be
      applied to the dummy to bring it to rest. (b) The passenger compartment comes to rest in 0.20 s. Calculate the
      deceleration. (c) Seat belt and air bag: dummy has average deceleration 80 m/s^2. Calculate the average resultant
      force on the dummy. (d) The deceleration of the dummy is less than that of the compartment. Explain why this is of
      benefit for the safety of a passenger.

  - n: "02"
    qno: 2
    type: theory
    marks: 5
    parts:
      - {label: "a", marks: 2}
      - {label: "b", marks: 1}
      - {label: "c", marks: 2}
    syllabus: ["1.6"]
    tier: supplement
    difficulty: 2
    segments:
      - {page: 7, y0: 36, y1: 620, x0: 65}
    ms:
      segments: [{page: 16, y0: 240, y1: 395}]
      text: "(a) 0.15 x 8.0 = 1.2 N s (b) 1.2 N s (c) F = 1.2/0.0015 = 800 N"
    text: |
      Fig. 2.1 shows a hammer being used to drive a nail into a piece of wood. Mass of hammer head 0.15 kg, speed 8.0 m/s
      when it hits the nail, contact time 0.0015 s; the hammer head stops. (a) Calculate the change in momentum of the
      hammer head. (b) State the impulse given to the nail. (c) Calculate the average force between the hammer and the nail.

  - n: "03"
    qno: 3
    type: theory
    marks: 5
    parts:
      - {label: "a", marks: 2}
      - {label: "b", marks: 3}
    syllabus: ["1.6"]
    tier: supplement
    difficulty: 2
    segments:
      - {page: 8, y0: 30, y1: 585, x0: 70}
    ms:
      segments: [{page: 16, y0: 405, y1: 520, x0: 60}]
      text: "(a) p = mv = 0.50 x 0.32 = 0.16 kg m/s (b) 0.16 = (0.50 + 0.30) v, v = 0.20 m/s. Note: sol-practice-sheet-detailed uses wrong masses and gives 1.20 m/s; the short key and this mark scheme give 0.20 m/s."
    text: |
      The engine of an unpowered toy train rolls at constant speed on a level track (Fig. 3.1) and collides with a
      stationary toy truck, joining with it. Engine 0.32 m/s, mass 0.50 kg. (a) Calculate the momentum of the toy engine
      before the collision. (b) Mass of truck 0.30 kg. Using the principle of conservation of momentum, calculate the speed
      of the joined engine and truck immediately after the collision.

  - n: "04"
    qno: 4
    type: theory
    marks: 5
    parts:
      - {label: "a", marks: 1}
      - {label: "b(i)", marks: 2}
      - {label: "b(ii)", marks: 2}
    syllabus: ["1.6"]
    tier: supplement
    difficulty: 2
    notes: "Printed Cambridge number '1' cropped away; worksheet mark scheme numbers it 4 (Golf)."
    segments:
      - {page: 9, y0: 22, y1: 592, x0: 75}
    ms:
      segments: [{page: 16, y0: 572, y1: 700}]
      text: "(a) mass x velocity (b)(i) 0.046 x 41 = 1.9 N s (ii) F = 1.9/5.0e-4 = 3800 N"
    text: |
      Fig. 2.1 shows a golfer about to hit a golf ball; initial momentum of the ball is zero. (a) Define momentum.
      (b) Club in contact with ball for 5.0 x 10^-4 s; ball leaves at 41 m/s; mass 0.046 kg. (i) Calculate the impulse on
      the golf ball. (ii) Calculate the force applied to the ball by the golf club.

  - n: "05"
    qno: 5
    type: theory
    marks: 10
    parts:
      - {label: "a(i)", marks: 1}
      - {label: "a(ii)", marks: 3}
      - {label: "a(iii)", marks: 2}
      - {label: "b", marks: 4}
    syllabus: ["1.6", "1.1", "1.2"]
    tier: supplement
    difficulty: 3
    notes: "Printed Cambridge number '3' cropped away; worksheet mark scheme numbers it 5 (Balloon)."
    segments:
      - {page: 10, y0: 24, y1: 530, x0: 68}
      - {page: 11, y0: 46, y1: 606, x0: 60}
    ms:
      segments: [{page: 17, y0: 52, y1: 260}]
      text: "(a)(i) force x time (for which it acts) (ii) v = 0.67/0.18 = 3.7 m/s; impulse = 0.015 x 3.7 = 0.056 N s (iii) air released moves in opposite direction; momentum of balloon equal in size to momentum of air (b) sqrt(0.40^2 + 0.74^2) = 0.84 N at 62 deg below the horizontal (tan = 0.74/0.40)."
    text: |
      (a) A balloon of mass 15 g is glued to a straw threaded onto a horizontal string (Fig. 3.1). Air is released; the
      balloon accelerates from rest then travels 0.67 m in 0.18 s at constant speed. (i) Explain in words what is meant by
      the term impulse. (ii) Calculate the resultant impulse on the balloon while it is accelerating. (iii) Explain how
      momentum is conserved as the balloon accelerates. (b) Fig. 3.2: two perpendicular forces 0.40 N (horizontal) and
      0.74 N (downwards) act on a balloon. Determine the magnitude and direction of the resultant force.

  - n: "06"
    qno: 6
    type: theory
    marks: 6
    parts:
      - {label: "b(i)", marks: 3}
      - {label: "b(ii)", marks: 3}
    syllabus: ["1.6", "1.7.1"]
    tier: supplement
    difficulty: 2
    notes: "Printed Cambridge number '4' cropped away; worksheet calls it 6 (Pulley). Only part (b) was pasted: part (a) of the original is missing, so the question starts at (b)."
    segments:
      - {page: 12, y0: 44, y1: 595, x0: 80}
    ms:
      segments: [{page: 17, y0: 303, y1: 432}]
      text: "(b)(i) I = m delta v = 2.0 x 0.60 = 1.2 N s (ii) kinetic energy of A decreases; thermal/internal energy produced due to friction; block slows down."
    text: |
      Two blocks A and B joined by a thin thread over a frictionless pulley; A at rest on a rough horizontal surface, B held
      just below the pulley (Fig. 1.1). B is released and falls 0.45 m before the thread tightens. Mass of B 0.50 kg.
      (b) Mass of A 2.0 kg; A moves to the right at 0.60 m/s. (i) Calculate the impulse exerted on block A as it accelerates
      from rest to 0.60 m/s. (ii) Both blocks move at constant 0.60 m/s until B hits the ground. Explain the energy change
      that takes place in block A after block B stops moving.

  - n: "07"
    qno: 7
    type: theory
    marks: 6
    parts:
      - {label: "a", marks: 3}
      - {label: "b(i)", marks: 2}
      - {label: "b(ii)", marks: 1}
    syllabus: ["1.6"]
    tier: supplement
    difficulty: 2
    notes: "Printed Cambridge number '5' cropped away; worksheet calls it 7 (Car collision)."
    segments:
      - {page: 13, y0: 22, y1: 600, x0: 70}
    ms:
      segments: [{page: 17, y0: 458, y1: 585}]
      text: "(a) momentum before = after; 800 x 2 = 1600; v = (1600 - 1300)/800 = 0.38 m/s (b)(i) impulse = change in momentum = 1300 N s (ii) 1300 N s"
    text: |
      Fig. 3.1 shows a collision at very slow speed between two cars. Car B, 800 kg, moving at 2.0 m/s collides with
      stationary car A, 1000 kg. Afterwards both travel in the initial direction of car B. (a) Car A moves at 1.3 m/s.
      Show that the speed of car B after the collision is approximately 0.4 m/s. (b)(i) Calculate the impulse exerted by
      car A on car B. (ii) State the impulse exerted by car B on car A.

  - n: "08"
    qno: 8
    type: theory
    marks: 7
    parts:
      - {label: "a(i)", marks: 2}
      - {label: "a(ii)", marks: 2}
      - {label: "b", marks: 3}
    syllabus: ["1.6", "1.7.2"]
    tier: supplement
    difficulty: 3
    notes: "Pasted without a question number."
    segments:
      - {page: 14, y0: 66, y1: 622}
    ms:
      segments: [{page: 18, y0: 30, y1: 185}]
      text: "(a)(i) 1.2 x 0.065 = 0.078 N s (ii) 0.078/0.00052 = 150 m/s (b) work done against friction; kinetic energy decreases to zero; thermal energy produced."
    text: |
      Fig. 2.1 shows a wooden trolley of mass 1.2 kg at rest on the rough surface of a bench. A ball of mass 0.52 g travels
      horizontally and embeds itself in the trolley; the trolley moves off at 0.065 m/s. (a) Calculate (i) the impulse
      exerted on the trolley (ii) the speed of the ball as it hits the trolley. (b) Explain, in terms of the work done, the
      energy change as the trolley slows down and stops.

  - n: "09"
    qno: 9
    type: theory
    marks: 7
    parts:
      - {label: "a", marks: 1}
      - {label: "b(i)", marks: 2}
      - {label: "b(ii)1", marks: 2}
      - {label: "b(ii)2", marks: 2}
    syllabus: ["1.7.1", "1.6"]
    tier: supplement
    difficulty: 2
    notes: "Pasted without a question number or stem; starts at part (a)."
    segments:
      - {page: 15, y0: 18, y1: 700}
    ms:
      segments: [{page: 18, y0: 222, y1: 405}]
      text: "(a) energy cannot be created or destroyed / total energy constant (b)(i) chemical to kinetic and/or gravitational potential; then KE to GPE, GPE to KE, KE to thermal (ii)1 p = 4.0 x 12 = 48 kg m/s 2 F = 48/0.60 = 80 N"
    text: |
      (a) State what is meant by the principle of conservation of energy. (b) Fig. 3.1 shows a girl throwing a heavy ball.
      (i) State the energy changes from when the girl begins to exert a force on the ball until it hits the ground and
      stops. (ii) Mass of ball 4.0 kg; force exerted for 0.60 s; speed increases from 0 to 12 m/s. Calculate 1. the
      momentum of the ball on leaving the girl's hand 2. the average resultant force exerted on the ball.
