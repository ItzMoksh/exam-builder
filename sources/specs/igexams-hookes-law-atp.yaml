      text: |
        (a) l0 = 55 mm c.a.o. [1]
        (b)(i) e = 4, 9, 14, 19, 23 (ecf from (a)) [1]
        (b)(ii) view scale at right angles, or straight edge / set square / pointer between bottom of spring and rule [1]
