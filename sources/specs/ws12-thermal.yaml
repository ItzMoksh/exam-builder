    text: |
      A room measures 4.5 m x 4.0 m x 2.4 m. The air in the room is heated by a gas-powered heater from 12 °C to 21 °C. The density of the air, assumed to remain constant, is 1.3 kg m-3.
      (a) Calculate the thermal energy required to raise the temperature of the air in the room. The specific heat capacity of air is 990 J kg-1 K-1. [3]
      (b) The heater has an output power of 2.3 kW. The heating gas has a density 0.72 kg m-3. Each cubic metre of heating gas provides 39 MJ of thermal energy. Use your answer to (a) to calculate (i) the time required to raise the temperature of the air from 12 °C to 21 °C [2] (ii) the mass of heating gas used in this time. [2]
      (c) Suggest two reasons why the time required and the mass of heating gas will in practice be greater than the values calculated in (b). [2]
