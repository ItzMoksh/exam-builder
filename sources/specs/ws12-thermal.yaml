      (a) In your answer you should use appropriate technical terms spelled correctly. State the terms used to describe the thermal energy required to change (i) a solid into a liquid at a constant temperature [1] (ii) a liquid into a gas at a constant temperature. [1]
      (b) Most households waste energy by overfilling electric kettles. Assume that, on average, 0.80 kg of water per household per day is unnecessarily boiled.
      (i) Estimate the energy required when 0.80 kg of water, initially at 18 °C, is heated in an electric kettle. The kettle switches off automatically when the water is boiling steadily at 100 °C. The specific heat capacity of water is 4200 J kg-1 K-1. heat energy = ... J [2]
