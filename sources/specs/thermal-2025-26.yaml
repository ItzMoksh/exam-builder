    text: |
      Evaporation occurs when molecules escape from a liquid surface into the air above it. During this process the
      temperature of the liquid falls. Why does the temperature of the liquid fall?
      A The molecules in the vapour expand because the pressure is less. B The molecules left in the liquid have more
      space to move around. C The molecules move more slowly when they escape into the air. D The molecules with the
      highest energies escape into the air.

