text: |
  A washbasin has an exit pipe covered with a plug of area 12 cm2. A chain is attached to the centre of the
  plug to assist in pulling the plug away from the exit hole. The washbasin contains water to a depth of
  0.080 m. The density of the water is 1000 kg/m3. What is the force acting on the plug due to the water?
  A 0.96 N  B 800 N  C 9600 N  D 80 000 N (liquid pressure p = rho g h)
