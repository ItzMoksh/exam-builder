text: |
  (a) The table shows the specific heat capacities c of alcohol and water: alcohol 2460 J kg-1 K-1, water 4180 J kg-1 K-1.
  (i) An alcohol thermometer is placed in 80 g of water at 20 °C. The mass of alcohol in the thermometer is 0.050 g. The water is then heated from 20 °C to 60 °C. Calculate the ratio energy required to warm the water from 20 °C to 60 °C / energy required to warm the alcohol from 20 °C to 60 °C. ratio = ... [2]
  (ii) State and explain a situation in which the very high value of specific heat capacity for water is useful. [2]
  (b) Describe an electrical experiment to determine the specific heat capacity c of a liquid. Include in your answer: a labelled diagram of the arrangement; a list of the measurements to be taken; an explanation of how the value of c would be determined from your results; possible sources of uncertainty in your measurements and how these could be reduced. [8]
