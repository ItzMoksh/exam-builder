text: Medium Q1. A car travels along a clear 10.0 km section of motorway in 6.0 minutes. It then drives
  through 3.0 km of roadworks in 3.0 minutes. Which calculation will give the correct average speed for
  the journey? A 3.0/3.0 = 1.00 km/min B 10.0/6.0 = 1.67 km/min C = 2.67 km/min D = 1.44 km/min
