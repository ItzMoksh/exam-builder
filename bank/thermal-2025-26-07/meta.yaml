text: |
  (a) The temperature of a block of iron is increased. State what happens to (i) the energy of the atoms due to their
  vibrations, (ii) the average separation of the atoms, (iii) the density of the iron. (b) Concrete roads are laid in
  sections with gaps filled with soft pitch (Fig. 6.1). Suggest why the concrete is laid in sections like this.
  (thermal expansion)
