text: |
  Fig. 4.1 shows a truck (forklift) lifting a heavy load, with a pivot at the front wheel.
  (a)(i) The truck is stationary. Identify the quantities that determine the work done as it lifts the load. Tick the box next to each correct quantity: distance, force, time. [1]
  (ii) Draw a ring around the unit for work done from the list: joule newton pascal watt. [1]
  (b) Identify the quantities that determine the power of the truck. Tick: energy transferred, temperature, time. [1]
  (c) The truck has a pivot near the front wheel. Fig. 4.2 represents the pivot and the vertical forces acting on the truck: 30 000 N at 1.5 m on one side of the pivot, load at 1.0 m on the other. The truck is in equilibrium. Calculate the load. [3]
  (d) Fig. 4.3 shows another truck lifting a pile of identical bricks. (i) On Fig. 4.3, draw a cross to indicate the centre of mass of the pile of bricks. [1]
  (ii) The truck can tilt the pile of bricks backwards, as shown in Fig. 4.4. Explain how tilting the pile of bricks backwards makes the truck more stable. [1]
