text: |
  A satellite orbits the Earth above the atmosphere at a constant speed. The diagram shows the satellite at one
  point in its circular orbit around the Earth. Which labelled arrow shows the direction of the resultant force
  on the satellite at the position shown? (A along the orbit, B away from Earth, C along the orbit, D towards
  Earth) Circular motion, centripetal force.
