text: |
  The diagram shows the vertical forces (air resistance upwards, weight downwards) acting on a ball as it falls vertically through the air. The ball does not reach terminal velocity.
  Which row describes what happens to the resultant force on the ball and what happens to the acceleration of the ball as it falls through the air?
  A resultant force decreases, acceleration decreases
  B decreases, increases
  C increases, decreases
  D increases, increases
