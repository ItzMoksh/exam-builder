text: Two plastic cups one inside the other with a small spacer and small air gap; hot water in the inner
  cup with a lid, standing on a bench. Which statement is correct? A bench heated by convection from bottom
  of outer cup B lid reduces energy lost by convection C no thermal conduction through sides D thermal
  radiation prevented by the small air gap
