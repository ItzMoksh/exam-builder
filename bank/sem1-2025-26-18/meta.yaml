text: |
  A wooden plank rests in equilibrium on two rocks on opposite sides of a narrow stream. Three forces P, Q and
  R act on the plank (P and R upwards at the rocks, Q downwards, weight). How are the sizes of the forces
  related? A P + Q = R  B P + R = Q  C P = Q = R  D P = Q + R
