text: |
  An object with a mass of 0.20 kg moves at 0.20 m/s to the right, as shown.
  Which other object has a momentum that is identical to the momentum of this object?
  A 0.20 kg moving up at 0.20 m/s
  B 0.40 kg moving down at 0.10 m/s
  C 0.40 kg moving right at 0.10 m/s
  D 0.20 kg moving left at 0.20 m/s
