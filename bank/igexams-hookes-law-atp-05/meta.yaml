notes: Figure/table numbers say Fig. 1.1 / Table 1.1 (copied from the original paper).
text: |
  The IGCSE class is investigating the stretching of a spring. Fig. 1.1 shows the experimental set up (spring hanging from a clamp above a bench, distance d0 from the bottom of the spring to the bench marked).
  (a) On Fig. 1.1, measure the vertical distance d0, in mm, between the bottom of the spring and the surface of the bench. [1]
  (b) The diagram is drawn 1/10th actual size. Calculate the actual distance D0, in mm, between the bottom of the spring and the surface of the bench. [1]
  (c) A student hangs a 1.0 N load on the spring. He measures and records the distance D between the bottom of the spring and the surface of the bench, and the value of the load L. He repeats the procedure using loads of 2.0 N, 3.0 N, 4.0 N and 5.0 N. Calculate the extension e of the spring, for each set of readings, using the equation e = (D0 - D). Record the values of L and e in Table 1.1: D/mm 199, 191, 179, 171, 160. [2]
  (d) Plot a graph of e/mm (y-axis) against L/N (x-axis). [4]
  (e) Determine the gradient G of the graph. Show clearly on the graph how you obtained the necessary information. [2]
  (f) When making measurements, the student is careful to avoid a line-of-sight error. Suggest one other precaution that the student should take when measuring the distance D between the bottom of the spring and the surface of the bench. [1]
