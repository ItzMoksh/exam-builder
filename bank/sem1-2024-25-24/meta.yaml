text: |
  Fig. 3.1 shows a boy throwing a ball at an object in a fairground. The ball has a mass of 190 g and travels horizontally with a constant speed of 6.9 m/s.
  (a) Calculate the momentum of the ball. [2]
  (b) After hitting the object, the ball bounces back along the same straight path with a speed of 1.5 m/s. The object has a mass of 1.8 kg. Calculate the speed of the object after it is hit by the ball. [3]
  (c) The kinetic energy of the ball is 4.5 J before the collision and 0.2 J after the collision. Calculate the change in total kinetic energy of the ball and object during the collision. [3]
