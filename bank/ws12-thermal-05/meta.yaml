text: |
  A car of mass 970 kg is travelling at 27 m s-1 when the brakes are applied. The car is brought to rest in a distance of 40 m.
  (a) (i) Calculate the kinetic energy of the car when it is travelling at 27 m s-1. [1]
  (ii) Hence calculate the average braking force on the car stating any assumption that you make. [3]
  (b) The car has four brake discs each of mass 1.2 kg. The material from which the discs are made has a specific heat capacity of 520 J kg-1 K-1.
  (i) Calculate the temperature rise of each disc after braking from a speed of 27 m s-1. Assume all the kinetic energy of the car is converted into internal energy of the brake discs equally during braking. [2]
  (ii) State and explain two reasons why the actual temperature rise will be different. [4]
  (iii) Suggest one modification to the design of the disc braking system that could reduce the temperature rise of the discs. [1]
