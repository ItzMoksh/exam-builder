text: |
  The diagram shows a series of images of a moving object taken at regular intervals. The object is moving
  from left to right (dots equally spaced, then increasingly far apart).
  Which statement describes the motion of the object?
  A accelerates continuously  B decelerates continuously  C travels at constant speed and then accelerates
  D travels at constant speed and then decelerates
