text: |
  (a) State the term used for the energy required to change a solid into a liquid. You should use the appropriate technical term spelled correctly. [1]
  (b) (i) Define the internal energy of a system. [2]
  (ii) There is a change in internal energy when a mass of water at 100 °C becomes an equal mass of vapour at 100 °C. Explain why. [2]
  (c) (i) The air in a greenhouse has a volume of 15 m3, a density of 1.2 kg m-3 and a specific heat capacity of 990 J kg-1 K-1. Immediately after sunset, the soil is transferring thermal energy to the air at an average rate of 12 W. Estimate the increase in temperature of the air in the greenhouse one hour after sunset as a result of this energy transfer from the soil. increase in temperature = ... K [3]
  (ii) Suggest two possible reasons why the actual increase in temperature of the air is likely to be much lower than this estimate. [2]
