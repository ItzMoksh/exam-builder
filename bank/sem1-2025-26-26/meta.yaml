text: |
  Fig. 3.1 shows a girl and a boy on a see-saw (girl 300 N at 2.4 m from the pivot, boy weight W at 1.6 m).
  The see-saw pivots on the log.
  (a) Calculate the girl's moment about the pivot. [2]
  (b) The see-saw is balanced horizontally. Calculate the weight W of the boy. [3] (principle of moments)
