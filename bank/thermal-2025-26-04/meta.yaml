text: |
  The diagram shows a cooling unit at the top of a refrigerator. Why is the cooling unit placed at the top?
  A Cold air falls and warm air is displaced upwards. B Cold air is a bad conductor so heat is not conducted into the
  refrigerator. C Cold air is a good conductor so heat is conducted out of the refrigerator. D Cold air remains at the
  top and so prevents convection.
