text: |
  (a) Fig. 2.1 shows a bookshelf with two groups of books A and B on it. There are six books in each group of books. All the books are identical. The mass of each book is 0.52 kg (books 30 cm x 21 cm x 1.3 cm; group A standing upright, group B lying flat).
  (i) Explain why the pressure exerted on the shelf by the books in group B is less than the pressure exerted on the shelf by the books in group A. [3]
  (ii) Calculate the pressure exerted on the shelf by the books in group A. [3]
  (b) A diver dives to a depth below the surface of the sea where the total pressure is 3.0 x 10^5 Pa. The atmospheric pressure is 1.0 x 10^5 Pa. The density of the sea water is 1030 kg/m3. Calculate the depth of the diver below the surface of the sea. [3]
