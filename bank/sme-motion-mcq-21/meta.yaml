text: Medium Q12. An object falls towards the surface of the Earth. The object is falling at its terminal
  velocity. Which statement is correct? A There is air resistance and the acceleration of the object is
  negative. B There is air resistance and the acceleration of the object is zero. C There is no air resistance
  and the acceleration of the object is negative. D There is no air resistance and the acceleration of
  the object is zero.
