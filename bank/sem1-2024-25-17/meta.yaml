text: |
  A measuring cylinder contains some water. A small metal block is slowly lowered into the water and is then removed.
  Finally a piece of plastic is attached to the metal block and the block is again slowly lowered into the water.
  The diagrams show the measuring cylinder at each stage of this process (1: water only at 55 cm3; 2: with metal block 70 cm3; 3: with metal block and plastic 80 cm3).
  What is the volume of the piece of plastic?
  A 10 cm3  B 25 cm3  C 70 cm3  D 80 cm3
