text: A man stands at rest on the surface of the Earth. The weight of the man is the gravitational force
  that acts on him. According to Newton's third law, the weight of the man is one force in a pair of forces.
  Which force is the other force in the pair? A a force downwards on the Earth B a force downwards on
  the man C a force upwards on the Earth D a force upwards on the man
