text: |
  A rocket is launched vertically upwards from the ground. The rocket travels with uniform acceleration from
  rest. After 8.0 s, the speed of the rocket is 120 m/s.
  (a) Calculate the acceleration of the rocket. [2]
  (b)(i) On Fig. 1.1 (speed/m/s 0-200 against time/s 0-27 grid), draw the graph for the motion of the rocket in
  the first 8.0 s. [1]
  (ii) Use the graph to determine the height of the rocket at 8.0 s. [2]
  (iii) From time = 8.0 s to time = 20.0 s, the rocket rises with increasing speed but with decreasing
  acceleration. From time = 20.0 s to time = 25.0 s, the rocket has a constant speed of less than 200 m/s.
  On Fig. 1.1, draw the graph for this motion. [3]
