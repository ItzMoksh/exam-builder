text: |
  (a) A student determines the volume of a piece of metal. The student pours 30 cm3 of water into a measuring cylinder. The piece of metal is submerged in the water and the new volume reading on the measuring cylinder is 42 cm3. Calculate the volume of the piece of metal. [1]
  (b) The mass of another piece of metal is 320 g. The volume of the piece of metal is 40 cm3. Calculate the density of the metal. Give the correct unit. [4]
  (c) The student drops the piece of metal into a tank of water. Two vertical forces act on the piece of metal as it falls through the water in the tank. On Fig. 2.1, each arrow represents a vertical force.
  (i) Complete the diagram in Fig. 2.1 by labelling the two forces. [2]
  (ii) The upward force is the same size as the downward force. Describe the motion of the piece of metal as it falls through the water. [1]
