text: |
  Two forces act on a block. A 12 N force acts vertically upwards, and a 5 N force acts horizontally to the right.
  a) Calculate the magnitude of the resultant force. b) Determine the angle the resultant force makes with the 5 N force.
  (resultant of two perpendicular vectors, Pythagoras, tan)
