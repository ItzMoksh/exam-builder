  A uniform plank rests on a pivot at its centre. Two children P and Q sit on the plank in the positions shown (P 1.2 m left of the pivot, Q 1.5 m right).
  The mass of child P is 25 kg. The plank is balanced. What is the mass of child Q?
  A 20 kg  B 25 kg  C 31 kg  D 45 kg
