text: |
  A racing car is fitted with an on-board computer. Every time the car passes the starting line, the computer
  records the distance travelled in the following two seconds. Which set of data shows that the car is
  increasing in speed during the two seconds? Tables of time/s and distance travelled/m:
  A 0, 100, 200  B 0, 90, 180  C 0, 80, 190  D 0, 100, 180
