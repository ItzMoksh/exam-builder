text: |
  A fixed mass of gas at constant temperature is compressed. Results: p/kPa 100, 200, 250, 400; V/cm3 80, 40, 32, 20.
  (a) Calculate p x V for each pair of readings. (b) State the relationship between p and V shown by the results, and
  the two conditions needed. (c) Calculate the volume when the pressure is 500 kPa.
