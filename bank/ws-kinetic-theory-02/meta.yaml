text: |
  Smoke particles in air are seen under a microscope. They move in random zigzag paths. What causes this? (Brownian motion)
  A The smoke particles are alive. B Convection currents in the cell.
  C Fast-moving air molecules, too small to see, collide with them at random. D The smoke particles repel each other.
