text: |
  An object is pivoted at point P. A student ties a length of string to a peg on the object. He pulls the string
  with a force F. Diagram shows distances q, r, s (perpendicular from P to the line of the string) and t.
  What is the moment of the force F about the point P?
  A F x q  B F x r  C F x s  D F x t
