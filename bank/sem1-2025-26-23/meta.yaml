text: |
  Fig. 1.1 is the top view of a rectangular paddling pool of constant depth (44.0 m by 20.0 m). The pool is
  filled with sea water.
  (a) The volume of the sea water in the pool is 264 m3. Calculate the depth of the pool. [3]
  (b) The mass of the sea water in the pool is 2.70 x 10^5 kg. Calculate the density of the sea water. Give your
  answer to 3 significant figures. [2]
  (c) Calculate the pressure due to the sea water at the bottom of the pool. [2]
  (d) State a suitable instrument for measuring the dimensions given in Fig. 1.1. [1]
