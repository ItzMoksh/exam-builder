text: |
  A student determines the mass of a load X using a balancing method (Fig. 1.1: metre rule pivoted at 50.0 cm mark,
  load X taped with centre over the 90.0 cm mark, mass m at distance d from the pivot). Fig. 1.2(a)-(e) show the
  rule balanced for m = 40 g, 50 g, 60 g, 70 g, 80 g (ruler scales). (a)(i) Use Fig. 1.2 to determine d for each m and
  record in Table 1.1 (m/g, d/cm, 1/d / 1/cm). (ii) Calculate 1/d. (b) Describe one difficulty the student might have
  and how he might overcome it. (c) Plot a graph of m/g (y-axis) against 1/d (x-axis). (d) Determine the gradient G
  of the graph. (e) Determine the mass mu of load X using mu = G/40.0.
