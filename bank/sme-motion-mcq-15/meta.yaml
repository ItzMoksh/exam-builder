text: Medium Q6. Two runners take part in a race. The graph shows how the speed of each runner changes
  with time. What does the graph show about the runners at time t? A Both runners are moving at the same
  speed. B Runner 1 has zero acceleration. C Runner 1 runs ahead of runner 2. D Runner 2 is slowing down.
