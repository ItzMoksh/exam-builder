text: |
  (a) Tidal power derives most of its energy from the Moon and part of its energy from the Sun.
  (i) State one other source of power which derives its energy from the Sun. [1]
  (ii) State one source of power which does not derive its energy from the Sun. [1]
  (b) Fig. 3.1 shows a small water turbine driven by a tidal flow of water to generate electrical power.
  (i) Explain whether this method of generation of electrical power is renewable. [2]
  (ii) The mass of water passing through the turbine each second is 6.0 x 10^3 kg. The speed of the water is
  2.0 m/s. 40% of the kinetic energy of the water is converted to electrical energy. Calculate the electrical
  power generated. [4] (efficiency, energy resources)
