text: |
  A metal ball is attached to a cork and is lowered into a measuring cylinder, pulling the cork into the water, as shown.
  Readings: ball and cork above the water 48 cm3; ball fully submerged but cork above the water 56 cm3; both ball and cork fully submerged 80 cm3.
  The mass of the cork is 4.8 g. What is the density of the cork?
  A 0.15 g/cm3  B 0.20 g/cm3  C 0.60 g/cm3  D 5.0 g/cm3
