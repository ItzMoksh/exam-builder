text: |
  A student looks at smoke particles in a glass cell of air using a microscope (Brownian motion). (a) Describe what the
  student sees. (b) Explain why the smoke particles move in this way. (c) State what this observation shows about the
  molecules of air. (d) The cell is warmed. State how the motion of the smoke particles changes.
