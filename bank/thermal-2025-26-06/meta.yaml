text: |
  (b) A block of ice is taken from a freezer at -25 °C, placed in a metal container and heated by a source of constant
  power. Fig. 4.1 is a temperature-time heating curve A-B-C-D-E (melting at 0 °C, boiling at 100 °C); at E the
  container is empty. (i) State what is taking place in the regions of the graph from B to C, and from D to E.
