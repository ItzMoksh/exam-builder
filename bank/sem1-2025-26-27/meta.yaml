text: |
  A student is determining the weight of a load using a balancing method. Fig. 1.1 shows the apparatus (metre
  rule on a pivot, load P at distance x, load Q at distance y).
  (a) The student places the metre rule on the pivot and adjusts its position so that the metre rule is as near
  as possible to being balanced. Scale reading = 50.2 cm. He places a 2.00 N load P on the metre rule so that
  its centre is exactly at the 20.0 cm mark on the rule.
  (i) Use this information to determine the distance x. [1]
  (ii) Explain how you would ensure that the centre of the load P is exactly at the 20.0 cm mark on the rule.
  You may draw a diagram. [2]
  (b) The student places a load Q on the metre rule and adjusts its position so that the metre rule is as near
  as possible to being balanced. He measures the distance y between the centre of load Q and the pivot.
  y = 15.3 cm. Calculate the weight W of load Q using the equation W = kx/y, where k = 2.00 N. [1]
  (c) The student repeats the procedure using a different, suitably chosen, distance x. Suggest a suitable
  distance x. [1]
  (d) The student calculates a new value of W = 4.04 N. Suggest two reasons why the values determined for W may
  not be the same. [2]
  (e) Calculate the average W_AV of the values for W, the weight of load Q. Give your answer to a suitable
  number of significant figures for this experiment. [2]
