text: |
  A plank balances horizontally on a log of wood, which acts as a pivot.
  (a) A girl sits on one end of the plank, and her brother pushes down on the other end to make the plank balance horizontally. Fig. 3.1: girl's weight = 404 N at 1.2 m from the pivot, force F at 1.6 m. Calculate the moment of the girl's weight about the pivot and show that it is close to 480 N m. [3]
  (b) The plank balances horizontally when the boy pushes down with a force F at a distance of 1.6 m from the pivot. Calculate the size of force F. [3]
