text: |
  A weightless beam is balanced on a pivot as shown. Forces P, Q and R act on the beam.
  Diagram: P acts downward at distance d left of the pivot; Q acts upward at distance b left of the pivot (c from P); R acts downward at distance a right of the pivot.
  Which equation is correct?
  A (P x c) + (Q x b) = (R x a)
  B (P x c) - (Q x b) = (R x a)
  C (P x d) + (Q x b) = (R x a)
  D (P x d) - (Q x b) = (R x a)
