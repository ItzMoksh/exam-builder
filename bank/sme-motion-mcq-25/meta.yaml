markscheme_text: 'D: average speed = (100 + 50 + 30 + 70) km / (4.0 - 0.5) h = 71.4 km/h.'
text: Hard Q3. A helicopter flies the route shown below (H to I 100 km, I to J 50 km, J to K 30 km, K
  to L 70 km). It stops at point I for 30 minutes to pick up some cargo. The total time the helicopter
  takes between taking off from H and landing at L is 4.0 hours. Calculate the average speed of the helicopter
  when it is flying. A 55.6 km/h B 250 km/h C 62.5 km/h D 71.4 km/h
