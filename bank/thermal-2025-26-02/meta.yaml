text: |
  The pressure of a fixed mass of gas in a cylinder is measured. The volume of the cylinder is then slowly decreased.
  The temperature of the gas does not change. Which graph could show the change of pressure of the gas during this
  process? (four pressure-time graphs A-D: A horizontal, B rising from zero, C rising from a non-zero value,
  D falling)
