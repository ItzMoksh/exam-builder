text: |
  A spring, which obeys Hooke's law, has an unstretched length of 10 cm. A load of 20 N is suspended from the
  spring. The new length of the spring is 36 cm. What is the spring constant k of the spring?
  A 0.56 N/cm  B 0.77 N/cm  C 1.3 N/cm  D 1.8 N/cm
