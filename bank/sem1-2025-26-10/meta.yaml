text: |
  The diagram shows a beam lying on the ground. End Q is lifted from the ground by the force F. End P of the
  beam remains on the ground. The length of the beam is 3.0 m and its weight is 600 N. The centre of mass of
  the beam at G is 1.0 m from end P. What is the size of the force F when it just raises end Q from the ground?
  A 200 N  B 300 N  C 400 N  D 600 N
