text: |
  The gravitational field strength is 8.8 N/kg on Venus and 3.8 N/kg on Mars. An object has a weight of 42 N
  on Venus. What are the mass and the weight of the object on Mars?
  A 4.8 kg, 18 N  B 4.8 kg, 42 N  C 11 kg, 42 N  D 11 kg, 97 N
