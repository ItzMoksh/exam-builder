text: 'Easy Q8. A speed-time graph is used to describe the motion of an object. Which quantities are calculated
  from the gradient of the graph and from the area under the graph? Table gradient / area: A acceleration,
  distance travelled; B acceleration, total journey time; C distance travelled, acceleration; D total
  journey time, distance travelled.'
