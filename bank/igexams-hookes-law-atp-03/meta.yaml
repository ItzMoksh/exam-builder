text: |
  The IGCSE class is investigating the motion of a mass hanging on a spring. Fig. 1.1 shows the apparatus (clamp holding spring, unstretched length l0 marked, clamp holding cork with a pin, bench).
  (a) On Fig. 1.1, measure the length l0 of the unstretched spring, in mm. [1]
  (b) The diagram is drawn one tenth of actual size. Write down the actual length L0 of the unstretched spring, in mm. [1]
  A student hangs a 300 g mass on the spring and measures the new length L of the spring: L = 255 mm.
  (i) Calculate the extension e of the spring using the equation e = (L - L0).
  (ii) Calculate a value for the spring constant k using the equation k = F/e, where F = 3.0 N. Include the appropriate unit. [2]
  (c) The student adjusts the position of the lower clamp so that the pin is level with the bottom of the mass when the mass is not moving. She pulls the mass down a short distance and releases it so that it oscillates up and down. Fig. 1.2 shows one complete oscillation. She measures the time t taken for 20 complete oscillations: t = 26.84 s. Calculate the time T taken for one complete oscillation. [1]
  (d) She replaces the 300 g mass with a 500 g mass. She repeats the timing: t = 34.48 s.
  (i) Calculate the time T taken for one complete oscillation.
  (ii) The student suggests that the time taken for the oscillations of the spring should not be affected by the change in mass. State whether her results support this suggestion and justify your answer by reference to the results. [2]
  (e) Explain briefly how you avoid a line-of-sight (parallax) error when measuring the length of a spring in this type of experiment. You may draw a diagram. [1]
