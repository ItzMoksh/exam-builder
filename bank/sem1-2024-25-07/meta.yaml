text: |
  An object is moving at +3.0 m/s. A force acts on the object. After a time, the object is moving at -4.0 m/s. The mass of the object is 5.0 kg.
  What is the change in momentum of the body?
  A -35 kg m/s  B -5.0 kg m/s  C +5.0 kg m/s  D +35 kg m/s
