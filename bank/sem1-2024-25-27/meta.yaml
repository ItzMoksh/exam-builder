text: |
  A student is determining the weight of a metre rule using a balancing method. Fig. 1.1 shows the apparatus: load P on a metre rule balanced on a pivot on a bench; a is the distance from the 90.0 cm mark (load P) to the pivot, b is the distance from the pivot to the 50.0 cm mark.
  The student places the load P at the 90.0 cm mark and adjusts the position of the metre rule on the pivot so that it is as near as possible to being balanced. He records a and b, then repeats with P at the 85.0 cm, 80.0 cm, 75.0 cm and 70.0 cm marks.
  Table 1.1: a/cm 21.0, 18.0, 16.0, 13.0, 10.5; b/cm 19.1, 17.2, 14.1, 11.8, 9.5.
  (a) Plot a graph of a/cm (y-axis) against b/cm (x-axis). You do not need to begin your axes at the origin (0,0). [4]
  (b) Determine the gradient G of the graph. Show clearly on the graph how you obtained the necessary information. [2]
  (c) Calculate the weight W1 of the metre rule using the equation W1 = G x P, where P = 1.0 N. [2]
  (d) Suggest one practical reason why it is difficult to obtain accurate readings for a and b in this type of experiment. [1]
