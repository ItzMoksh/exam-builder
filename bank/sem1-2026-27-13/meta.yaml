text: An athlete doing press-ups on a floor using both hands; area of contact of each hand with the floor
  is S; toes act as a pivot. The athlete's weight W acts through point X; the distance between toes and
  X is three quarters of the distance between toes and shoulders. What is the pressure exerted on the
  palm of each of the athlete's hands? A W/8S B 3W/8S C W/4S D 3W/4S
