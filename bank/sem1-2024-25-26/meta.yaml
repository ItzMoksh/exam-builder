text: |
  A student determines the density of a block of wood.
  (a) Fig. 1.1 shows one face of the block of wood that the student uses.
  (i) Measure the length l and width w of the block of wood. Fig. 1.1 is drawn actual size. [1]
  (ii) The student measures the height h of the block of wood: h = 4.0 cm. Calculate the volume V of the block of wood using the equation V = l x w x h. [1]
  (iii) The student measures the mass m of the block of wood on a balance (reading 63.92 g, Fig. 1.2). Write down the mass m of the block as shown in Fig. 1.2. Give your answer to the nearest gram. [1]
  (iv) Calculate the density rho of the wood using the equation rho = m/V. Give your answer to a suitable number of significant figures for this experiment and include the unit. [2]
  (b) The student places the block of wood carefully in water in a glass dish. The wood floats as shown in Fig. 1.3.
  (i) Using Fig. 1.3, estimate, without taking a measurement, the volume V1 of wood that is below the water surface. [1]
  (ii) Calculate mW, the mass of water with volume V1, using the equation mW = rhoW x V1, where rhoW = 1.00 in the same units as rho in part (a)(iv). [1]
  (c) A student suggests that the mass m of the block of wood should be equal to the mass mW of the water with volume V1.
  (i) Calculate the difference d between your values of m and mW. [1]
  (ii) Discuss whether the difference d is small enough to conclude that m = mW. [1]
  (d) Another student wants to obtain a more accurate value for V1. He uses the method of floating the block of wood in water as described in (b). Suggest how the student could obtain a more accurate value by taking a measurement. [2]
