text: |
  A syringe contains a fixed mass of air, trapped by a sealed end. (a) Explain, in terms of particles, how the air
  exerts a pressure on the walls of the syringe. (b) The plunger is pushed in slowly at constant temperature. State and
  explain the change in pressure. (c) The syringe is held fixed and warmed. Explain why the pressure rises.
