text: 'Hard Q1. A cannonball is dropped from a three story building. Which row of the table correctly
  describes both the speed and the acceleration of the cannonball as it falls? You can ignore air resistance
  for this question. Speed / Acceleration: A constant constant; B increasing constant; C increasing increasing;
  D constant increasing. Free fall.'
